<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:;">

<style>
  :root {
    --neon-blue: #00f3ff;
    --neon-purple: #b300ff;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .table-fixed-header { background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; box-shadow: var(--border-glow), 0 10px 30px rgba(0,0,0,0.6); }
  .thead-container { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .thead-container::-webkit-scrollbar { display: none; }
  .thead-container table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
  .tbody-container { overflow-x: auto; overflow-y: auto; max-height: 70vh; position: relative; }
  .tbody-container table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }

  .error { color: var(--danger); margin-top: 15px; text-shadow: 0 0 8px var(--danger); }

<body>
<canvas id="particleCanvas"></canvas>
<div id="app"></div>
<script>
(function() {
  // 粒子背景
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [], PARTICLE_COUNT = 150, centerX, centerY;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; centerX = canvas.width / 2; centerY = canvas.height / 2; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  class Particle {
    constructor() { this.reset(true); }
    reset(initial) { const angle = Math.random() * Math.PI * 2; const distance = initial ? Math.random() * 50 : 10; this.x = centerX + Math.cos(angle) * distance; this.y = centerY + Math.sin(angle) * distance; const speed = 0.5 + Math.random() * 1.5; this.speedX = Math.cos(angle) * speed; this.speedY = Math.sin(angle) * speed; this.size = 0.5 + Math.random() * 2; this.opacity = 0.4 + Math.random() * 0.6; this.color = Math.random() > 0.5 ? 'rgba(0,243,255,' : 'rgba(255,255,255,'; }
    update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset(); }
    draw(ctx) { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = this.color + this.opacity + ')'; ctx.fill(); }
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
  function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100); gradient.addColorStop(0, 'rgba(0, 243, 255, 0.05)'); gradient.addColorStop(1, 'rgba(0, 243, 255, 0)'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(ctx); }); requestAnimationFrame(animateParticles); }
  animateParticles();

  function escapeHtml(str) { if (str == null) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  const SUPABASE_URL = "https://gbedtcwsnwteneiokizp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6kqvIXFMeqXW-xmwh7GcHQ_LvfH2zon";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const SUPER_ADMIN_EMAIL = "liuping@vip.com";

  const PRESET_FUELS = [
    { gcode: "60518727", gname: "95号车用汽油(ⅥB)", label: "95汽油" },
    { gcode: "60518726", gname: "92号车用汽油(ⅥB)", label: "92汽油" },
    { gcode: "60518728", gname: "98号车用汽油(ⅥA)(ⅥB)", label: "98汽油" },
    { gcode: "60523537", gname: "爱跑98号车用汽油(ⅥB)", label: "爱跑98" },
    { gcode: "60514943", gname: "0号车用柴油(VI)", label: "0#柴油" },
  ];

  const T = {
    loginTitle: '数据中心', emailPlaceholder: '邮箱', passwordPlaceholder: '密码', loginBtn: '进入系统', logoutBtn: '退出登录',
    summaryLoading: '加载中...', summaryPrefix: '站点评论次数', noData: '暂无数据', loadErrorPrefix: '系统异常：',
    tableHeaders: ['站点编码','站点简称','销售单号','油品名称','手机号','姓名','CTC','TTC','评价内容','提交时间'],
    siteSummaryNone: '无', title: '数据中心欢迎您', monthLabel: '选择月份：', rememberMe: '记住密码',
    adminBtn: '用户管理', batchBtn: '批量生成账号', configBtn: '站点数据配置',
    totalLabel: '累计评论总数', todayLabel: '今日评论数', filterPlaceholder: '输入站点编码 (例如 33300011)'
  };

  let allTimestamps = [];
  let currentMonthLogs = [];
  let currentFilterStncode = '';
  let currentSort = { col: null, asc: true };

  function showLoading(msg = '加载中...') {
    let overlay = document.getElementById('globalLoading');
    if (!overlay) {
      overlay = document.createElement('div'); overlay.id = 'globalLoading'; overlay.className = 'loading-overlay';
      overlay.innerHTML = '<div class="loading-spinner"></div><div style="color:white; font-size:14px;" id="loadingMsg">'+escapeHtml(msg)+'</div>';
      document.body.appendChild(overlay);
    } else { document.getElementById('loadingMsg').textContent = msg; }
    overlay.style.display = 'flex';
  }
  function hideLoading() { const el = document.getElementById('globalLoading'); if (el) el.style.display = 'none'; }

  function startClock() {
    const clockEl = document.getElementById('liveClock');
    if (!clockEl) return;
    function update() {
      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
      clockEl.textContent = '⏱ ' + timeStr;
    }
    update();
    setInterval(update, 1000);
  }

  function buildUI() {
    const app = document.getElementById('app'); app.innerHTML = '';
    const loginSec = document.createElement('div'); loginSec.id = 'loginSection';
    loginSec.innerHTML = `<div class="login-box"><h3>${T.loginTitle}</h3><input type="email" id="email" placeholder="${T.emailPlaceholder}" required autocomplete="email"><div class="password-wrapper"><input type="password" id="password" placeholder="${T.passwordPlaceholder}" required autocomplete="off"><button class="password-toggle" id="togglePwd" type="button" title="显示密码">👁️</button></div><div class="remember-row"><input type="checkbox" id="rememberMe"><label for="rememberMe">${T.rememberMe}</label></div><button type="button" id="loginBtn">${T.loginBtn}</button><p id="loginError" class="error"></p></div>`;
    app.appendChild(loginSec);
    const dataSec = document.createElement('div'); dataSec.id = 'dataSection'; dataSec.style.display = 'none';
    dataSec.innerHTML = `<div class="header"><div class="title" id="pageTitle"><span>${T.title}</span> <span class="user-email-in-title"></span></div><div style="display: flex; gap: 8px; flex-wrap: wrap;" id="adminButtonGroup"><button id="adminBtn" class="admin-btn" style="display:none;">${T.adminBtn}</button><button id="configBtn" class="config-btn" style="display:none;">${T.configBtn}</button><button id="refreshBtn" class="config-btn" style="display:none;">🔄 刷新</button><button id="logoutBtn" class="logout-btn">${T.logoutBtn}</button></div></div><div class="top-bar"><div class="stats-grid" id="globalStats"><div class="stat-card"><div class="label">${T.totalLabel}</div><div class="number" id="totalCount">-</div></div><div class="stat-card"><div class="label">${T.todayLabel}</div><div class="number" id="todayCount">-</div></div></div><div class="month-selector-inline"><label for="monthSelect">${T.monthLabel}</label><select id="monthSelect"><option>加载中...</option></select></div></div><div class="filter-bar"><div class="filter-input"><label for="stncodeFilter">📍 站点编码 <span class="live-clock" id="liveClock"></span></label><input type="text" id="stncodeFilter" placeholder="${T.filterPlaceholder}"></div><button id="applyFilterBtn">🔍 查询</button><button id="resetFilterBtn">🔄 重置</button></div><div class="summary-inline" id="summaryInline">${T.summaryLoading}</div><div class="table-fixed-header"><div class="thead-container" id="theadContainer"><table id="headerTable"><thead id="tableHead"></thead></table></div><div class="tbody-container" id="tbodyContainer"><table id="dataTable"><tbody id="tableBody"></tbody></table><div class="empty-state" id="emptyMessage" style="display:none;">${T.noData}</div></div></div><p id="dataError" class="error"></p>`;
    app.appendChild(dataSec);
    const thead = document.getElementById('tableHead');
    const tr = document.createElement('tr');
    T.tableHeaders.forEach((h, idx) => { 
      const th = document.createElement('th'); 
      th.textContent = h; 
      th.dataset.colIndex = idx;
      th.addEventListener('click', () => sortTable(idx));
      tr.appendChild(th); 
    });
    thead.appendChild(tr);
    const tbodyContainer = document.getElementById('tbodyContainer');
    const theadContainer = document.getElementById('theadContainer');
    if (tbodyContainer && theadContainer) tbodyContainer.addEventListener('scroll', () => { theadContainer.scrollLeft = tbodyContainer.scrollLeft; });
    startClock();
    document.getElementById('refreshBtn').addEventListener('click', () => loadMonthData(document.getElementById('monthSelect').value));
  }

  function showLogin() {
    document.getElementById('loginSection').style.display = 'flex';
    document.getElementById('dataSection').style.display = 'none';
    const savedEmail = localStorage.getItem('supabase_saved_email');
    if (savedEmail) { document.getElementById('email').value = savedEmail; document.getElementById('rememberMe').checked = true; }
  }

  async function getCurrentUserRole() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return null;
    if (user.email === SUPER_ADMIN_EMAIL) return 'super_admin';
    if (user.user_metadata?.role === 'admin') return 'admin';
    return 'user';
  }

  async function showData() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dataSection').style.display = 'block';
    currentFilterStncode = ''; document.getElementById('stncodeFilter').value = '';
    await loadAvailableMonths();
    await loadMonthData(document.getElementById('monthSelect').value);
    await updateUIByRole();
    await updateTitleWithUser();
  }

  async function updateTitleWithUser() {
    const { data: { user } } = await supabase.auth.getUser();
    const titleEl = document.getElementById('pageTitle');
    if (titleEl && user) {
      const emailSpan = titleEl.querySelector('.user-email-in-title');
      if (emailSpan) emailSpan.textContent = `(${user.email})`;
    }
  }

  async function login() {
    const btn = document.getElementById('loginBtn'); const errEl = document.getElementById('loginError');
    const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value;
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = '请输入邮箱和密码'; return; }
    if (!email.includes('@')) { errEl.textContent = '邮箱格式不正确'; return; }
    btn.disabled = true; btn.textContent = '验证中...'; showLoading('正在登录...');
    try {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      if (document.getElementById('rememberMe').checked) localStorage.setItem('supabase_saved_email', email);
      else localStorage.removeItem('supabase_saved_email');
      hideLoading(); btn.textContent = T.loginBtn; btn.disabled = false;
      await showData();
    } catch (err) {
      hideLoading(); errEl.textContent = T.loadErrorPrefix + (err.message || '未知错误');
      btn.disabled = false; btn.textContent = T.loginBtn;
    }
  }

  async function logout() { await supabase.auth.signOut(); showLogin(); allTimestamps = []; currentMonthLogs = []; }

  async function fetchAllTimestamps() {
    if (allTimestamps.length) return allTimestamps;
    let allData = []; let from = 0; const batchSize = 1000;
    while (true) {
      const { data, error } = await supabase.from('request_logs').select('created_at').order('created_at', { ascending: false }).range(from, from + batchSize - 1);
      if (error) throw error;
      if (data && data.length > 0) { allData = allData.concat(data); from += batchSize; if (data.length < batchSize) break; }
      else break;
    }
    allTimestamps = allData;
    return allTimestamps;
  }

  async function fetchMonthLogs(month) {
    const startDate = `${month}-01`;
    const [year, mon] = month.split('-').map(Number);
    const nextMonth = mon === 12 ? `${year+1}-01` : `${year}-${String(mon+1).padStart(2,'0')}`;
    const endDate = `${nextMonth}-01`;
    let allData = []; let from = 0; const batchSize = 1000;
    while (true) {
      const query = supabase.from('request_logs').select('created_at, request_body')
        .gte('created_at', startDate).lt('created_at', endDate)
        .order('created_at', { ascending: false }).range(from, from + batchSize - 1);
      const { data, error } = await query;
      if (error) throw error;
      if (data && data.length > 0) { allData = allData.concat(data); from += batchSize; if (data.length < batchSize) break; }
      else break;
    }
    return allData;
  }

  function getFilteredLogs() {
    if (!currentMonthLogs) return [];
    if (!currentFilterStncode) return currentMonthLogs;
    return currentMonthLogs.filter(log => log.request_body?.stncode?.toString() === currentFilterStncode.toString());
  }

  function updateGlobalStats() {
    const total = allTimestamps.length;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayCount = allTimestamps.filter(log => new Date(log.created_at) >= today).length;
    document.getElementById('totalCount').innerText = total;
    document.getElementById('todayCount').innerText = todayCount;
  }

  async function loadAvailableMonths() {
    showLoading('正在加载月份...');
    try {
      await fetchAllTimestamps();
      const months = new Set();
      allTimestamps.forEach(l => { if (l.created_at) months.add(l.created_at.substring(0,7)); });
      const sorted = Array.from(months).sort().reverse();
      const select = document.getElementById('monthSelect');
      select.innerHTML = sorted.map(m => `<option value="${m}">${m}</option>`).join('');
      if (sorted.length > 0) { select.value = sorted[0]; }
      else { select.innerHTML = '<option value="">无数据</option>'; document.getElementById('summaryInline').textContent = T.siteSummaryNone; }
    } catch (err) {
      document.getElementById('dataError').textContent = '月份加载失败：' + err.message;
    } finally {
      hideLoading();
    }
  }

  async function loadMonthData(month) {
    if (!month) return;
    showLoading('加载数据中...');
    try {
      currentMonthLogs = await fetchMonthLogs(month);
      renderSummary(month);
      renderTable();
      updateGlobalStats();
    } catch (err) {
      document.getElementById('dataError').textContent = '数据加载失败：' + err.message;
    } finally {
      hideLoading();
    }
  }

  function renderSummary(month) {
    const logs = currentMonthLogs;
    const counts = {};
    logs.forEach(l => { const code = l.request_body?.stncode; if (code) counts[code] = (counts[code]||0)+1; });
    const items = Object.entries(counts).map(([c, n]) => `${escapeHtml(c)}: <span style="color: var(--success); font-weight: bold;">${n}次</span>`).join(' | ');
    document.getElementById('summaryInline').innerHTML = items ? `${T.summaryPrefix} (${month})：${items}` : `${T.summaryPrefix} (${month})：${T.siteSummaryNone}`;
  }

  function sortTable(colIndex) {
    if (currentSort.col === colIndex) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.col = colIndex;
      currentSort.asc = true;
    }
    renderTable();
  }

  function renderTable() {
    const filtered = getFilteredLogs();
    const tbody = document.getElementById('tableBody'), emptyMsg = document.getElementById('emptyMessage');
    tbody.innerHTML = ''; 
    if (filtered.length === 0) { emptyMsg.style.display = 'block'; return; } else emptyMsg.style.display = 'none';

    if (currentSort.col !== null) {
      const asc = currentSort.asc;
      filtered.sort((a, b) => {
        const bodyA = a.request_body, bodyB = b.request_body;
        let valA, valB;
        switch(currentSort.col) {
          case 0: valA = bodyA?.stncode || ''; valB = bodyB?.stncode || ''; break;
          case 1: valA = bodyA?.shortname || ''; valB = bodyB?.shortname || ''; break;
          case 2: valA = bodyA?.saleno || ''; valB = bodyB?.saleno || ''; break;
          case 3: valA = bodyA?.gname || ''; valB = bodyB?.gname || ''; break;
          case 4: valA = bodyA?.mobilephone || ''; valB = bodyB?.mobilephone || ''; break;
          case 5: valA = bodyA?.name || ''; valB = bodyB?.name || ''; break;
          case 6: valA = bodyA?.ctc || ''; valB = bodyB?.ctc || ''; break;
          case 7: valA = bodyA?.ttc || ''; valB = bodyB?.ttc || ''; break;
          case 8: valA = bodyA?.questiondata?.length ? bodyA.questiondata[bodyA.questiondata.length-1].answercontent : ''; valB = bodyB?.questiondata?.length ? bodyB.questiondata[bodyB.questiondata.length-1].answercontent : ''; break;
          case 9: valA = a.created_at || ''; valB = b.created_at || ''; break;
          default: return 0;
        }
        if (valA < valB) return asc ? -1 : 1;
        if (valA > valB) return asc ? 1 : -1;
        return 0;
      });
    }

    const fragment = document.createDocumentFragment();
    filtered.forEach(row => {
      const body = row.request_body; const tr = document.createElement('tr');
      [body?.stncode, body?.shortname, body?.saleno, body?.gname, body?.mobilephone, body?.name, body?.ctc, body?.ttc, (body?.questiondata?.length ? body.questiondata[body.questiondata.length-1].answercontent : ''), row.created_at].forEach(v => { const td = document.createElement('td'); td.textContent = v || ''; if (v && v.length > 15) td.title = v; tr.appendChild(td); });
      fragment.appendChild(tr);
    });
    tbody.appendChild(fragment);
  }

  async function updateUIByRole() {
    const role = await getCurrentUserRole();
    const isAdmin = (role === 'super_admin' || role === 'admin');
    document.getElementById('adminBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('configBtn').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('refreshBtn').style.display = 'inline-block';

          </div>
        </div>
        <h4 style="color: var(--neon-blue); margin-bottom: 10px;">用户列表 (${users.length})</h4>
        <div style="max-height: 400px; overflow-y: auto;">
          <table class="user-table">
            <thead><tr><th>邮箱</th><th>用户ID</th><th>角色</th><th style="text-align: center;">操作</th></tr></thead>
            <tbody id="userTableBody">
              ${users.map(u => {
                let roleLabel = '普通用户';

                const isSuperAdminUser = (u.email === SUPER_ADMIN_EMAIL);
                return `<tr>
                  <td>${escapeHtml(u.email || '')}</td>
                  <td style="font-family: monospace;">${escapeHtml(u.id ? u.id.substring(0,8)+'...' : '')}</td>
                  <td>${escapeHtml(roleLabel)}</td>
                  <td style="text-align: center;">
                    <button class="btn-primary reset-pwd-btn" data-userid="${escapeHtml(u.id)}" data-email="${escapeHtml(u.email)}">重置密码</button>
                    <button class="btn-danger delete-user-btn" data-userid="${escapeHtml(u.id)}" data-email="${escapeHtml(u.email)}" ${isSuperAdminUser ? 'disabled title="不允许删除超级管理员"' : ''}>删除</button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('closeAdminPanel').onclick = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    const firstFocusable = overlay.querySelector('button, input, select, textarea');
    if (firstFocusable) firstFocusable.focus();
    
    const userTableBody = document.getElementById('userTableBody');
    userTableBody.addEventListener('click', async (e) => {
      const target = e.target;
      if (target.classList.contains('reset-pwd-btn')) {

  // --- 可复用编辑器 ---
  function parseFuelMappings(text) { const mappings = []; if (!text) return mappings; const parts = text.split(','); for (let i = 0; i < parts.length; i += 2) { const gcodePart = parts[i]?.trim(); const gnamePart = parts[i+1]?.trim(); if (gcodePart && gnamePart) { const gcode = gcodePart.replace('gcode:', '').trim(); const gname = gnamePart.replace('gname:', '').trim(); if (gcode && gname) mappings.push({ gcode, gname }); } } return mappings; }
  function serializeFuelMappings(mappings) { return mappings.map(m => `gcode:${m.gcode},gname:${m.gname}`).join(','); }

  class FuelMappingEditor {
    constructor(container, initialValue = '', enabled = true) {
      this.container = container;
      this.enabled = enabled;
      this._build(initialValue);
    }

    _build(initialValue) {
      this.container.innerHTML = '';
      const presetDiv = document.createElement('div');
      presetDiv.style.display = 'flex'; presetDiv.style.gap = '4px'; presetDiv.style.flexWrap = 'nowrap'; presetDiv.style.overflowX = 'auto'; presetDiv.style.marginBottom = '6px';
      PRESET_FUELS.forEach(f => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fuel-preset-btn preset-fuel-btn';
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          if (!this.enabled) return;
          this._togglePreset(btn, f.gcode, f.gname);
        });
        presetDiv.appendChild(btn);
        btn._fuelData = { gcode: f.gcode, gname: f.gname };
      });
      const entriesDiv = document.createElement('div'); entriesDiv.className = 'fuel-entries';
      this.entriesDiv = entriesDiv;
      this.container.appendChild(presetDiv);
      this.container.appendChild(entriesDiv);

      const mappings = parseFuelMappings(initialValue);
      if (mappings.length === 0) mappings.push({ gcode: '', gname: '' });
      mappings.forEach(m => this._addEntry(m.gcode, m.gname));

      const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'mode-btn'; addBtn.textContent = '+ 自定义油品'; addBtn.style.marginTop = '8px';
      addBtn.addEventListener('click', () => { if (this.enabled) this._addEntry('', ''); });
      this.addBtn = addBtn;
      entriesDiv.appendChild(addBtn);

      this._syncPresetButtons();
      this._applyEnabledState();
    }

    _addEntry(gcode, gname) {
      const entryDiv = document.createElement('div'); entryDiv.className = 'fuel-mapping-entry';
      entryDiv.innerHTML = `<input type="text" placeholder="gcode" value="${escapeHtml(gcode)}" class="fuel-gcode"><input type="text" placeholder="gname" value="${escapeHtml(gname)}" class="fuel-gname"><button type="button" class="btn-remove-fuel">✕</button>`;
      entryDiv.querySelector('.btn-remove-fuel').addEventListener('click', () => {
        entryDiv.remove();
        this._syncPresetButtons();
      });
      this.entriesDiv.insertBefore(entryDiv, this.addBtn);
      this._syncPresetButtons();
    }

    _togglePreset(btn, gcode, gname) {
      const existing = Array.from(this.entriesDiv.querySelectorAll('.fuel-gcode')).find(inp => inp.value.trim() === gcode);
      if (existing) {
        existing.closest('.fuel-mapping-entry').remove();
      } else {
        this._addEntry(gcode, gname);
      }
      this._syncPresetButtons();
    }

    _syncPresetButtons() {
      const existingGcodes = new Set();
      this.entriesDiv.querySelectorAll('.fuel-gcode').forEach(inp => { if (inp.value.trim()) existingGcodes.add(inp.value.trim()); });
      this.container.querySelectorAll('.preset-fuel-btn').forEach(btn => {
        if (existingGcodes.has(btn._fuelData.gcode)) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
    }

    _applyEnabledState() {
      const inputs = this.entriesDiv.querySelectorAll('input');
      const removeBtns = this.entriesDiv.querySelectorAll('.btn-remove-fuel');
      const presetBtns = this.container.querySelectorAll('.preset-fuel-btn');
      inputs.forEach(inp => { inp.readOnly = !this.enabled; });
      removeBtns.forEach(btn => { btn.disabled = !this.enabled; btn.style.opacity = this.enabled ? '1' : '0.5'; });
      presetBtns.forEach(btn => { btn.style.pointerEvents = this.enabled ? 'auto' : 'none'; btn.style.opacity = this.enabled ? '1' : '0.5'; });
      this.addBtn.style.display = this.enabled ? 'inline-flex' : 'none';
    }

    setEnabled(enabled) {
      this.enabled = enabled;
      this._applyEnabledState();
    }

    getMappings() {
      const mappings = [];
      this.entriesDiv.querySelectorAll('.fuel-mapping-entry').forEach(entry => {
        const gcode = entry.querySelector('.fuel-gcode').value.trim();
        const gname = entry.querySelector('.fuel-gname').value.trim();
        if (gcode && gname) mappings.push({ gcode, gname });
      });
      return mappings;
    }
  }

  class CardnoEditor {
    constructor(container, initialValue = '', enabled = true) {

      if (!confirm('确定删除该站点？此操作不可撤销！')) return;
      try {
        const { error } = await supabase.from('stations').delete().eq('id', currentEditStationId);
        if (error) throw error;
        alert('站点已删除'); closeModal();
      } catch (err) { document.getElementById('configMsg').textContent = '删除失败: ' + err.message; }
    };

    async function updateStationsDates(stationIds, startdate, enddate) {
      if (!stationIds.length) { alert('没有选中任何站点'); return; }
      const { data: { session } } = await supabase.auth.getSession(); if (!session) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/update-stations-dates`, { method: 'POST', headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ stationIds, startdate, enddate }) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error);
        alert(`成功更新 ${result.updatedCount} 个站点`);
        await refreshStationList();
      } catch (err) { alert('批量更新失败: ' + err.message); }
    }
    function getSelectedIds() { return Array.from(document.querySelectorAll('#stationChecklist input[type="checkbox"]:checked')).map(cb => cb.value); }
    async function refreshStationList() {
      const { data, error } = await supabase.from('stations').select('id, stncode, shortname, startdate, enddate');
      if (!error && data) {
        stationsList = data;
        const container = document.getElementById('stationChecklist');
        const today = new Date().toISOString().slice(0,10);
        container.innerHTML = stationsList.map(s => {
          const start = s.startdate ? s.startdate.slice(0,10) : '';
          const end = s.enddate ? s.enddate.slice(0,10) : '';
          const isEnabled = (start <= today && today <= end);
          return `<div class="station-item"><input type="checkbox" value="${escapeHtml(s.id)}" id="chk_${escapeHtml(s.id)}"><label for="chk_${escapeHtml(s.id)}">${escapeHtml(s.stncode)} - ${escapeHtml(s.shortname)} (区间: ${escapeHtml(start||'无')} ~ ${escapeHtml(end||'无')}) ${isEnabled ? '✅启用中' : '❌已禁用'}</label></div>`;
        }).join('');
      }
    }
    const todayStr = new Date().toISOString().slice(0,10), farFuture = '2099-12-31';
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1); const yesterdayStr = yesterday.toISOString().slice(0,10);
    document.getElementById('enableAllBtn').onclick = () => updateStationsDates(stationsList.map(s=>s.id), todayStr, farFuture);
    document.getElementById('disableAllBtn').onclick = () => updateStationsDates(stationsList.map(s=>s.id), null, yesterdayStr);
    document.getElementById('enableSelectedBtn').onclick = () => { const ids = getSelectedIds(); if (!ids.length) alert('请先勾选'); else updateStationsDates(ids, todayStr, farFuture); };
    document.getElementById('disableSelectedBtn').onclick = () => { const ids = getSelectedIds(); if (!ids.length) alert('请先勾选'); else updateStationsDates(ids, null, yesterdayStr); };
    document.getElementById('applyDateToSelected').onclick = () => {
      const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value;
      if (!start || !end) alert('请填写完整日期');
      else { const ids = getSelectedIds(); if (!ids.length) alert('请先勾选站点'); else updateStationsDates(ids, start, end); }
    };
    document.getElementById('applyDateToAll').onclick = () => {
      const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value;
      if (!start || !end) alert('请填写完整日期');
      else updateStationsDates(stationsList.map(s=>s.id), start, end);
    };
  }

  function bindEvents() {
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password'), btn = document.getElementById('togglePwd');
      if (pwd.type === 'password') { pwd.type = 'text'; btn.innerHTML = '🙈'; } else { pwd.type = 'password'; btn.innerHTML = '👁️'; }
    });
    document.getElementById('adminBtn').addEventListener('click', showAdminPanel);
    document.getElementById('configBtn').addEventListener('click', showStationConfig);
    const monthSelect = document.getElementById('monthSelect');
    monthSelect.addEventListener('change', () => loadMonthData(monthSelect.value));
    let filterTimeout;
    document.getElementById('stncodeFilter').addEventListener('input', function(e) { clearTimeout(filterTimeout); filterTimeout = setTimeout(() => { currentFilterStncode = e.target.value.trim(); renderTable(); }, 300); });
    document.getElementById('applyFilterBtn').onclick = () => { currentFilterStncode = document.getElementById('stncodeFilter').value.trim(); renderTable(); };
    document.getElementById('resetFilterBtn').onclick = () => { document.getElementById('stncodeFilter').value = ''; currentFilterStncode = ''; renderTable(); };
  }

  buildUI(); bindEvents();
  (async function init() { const { data: { session } } = await supabase.auth.getSession(); if (session) await showData(); else showLogin(); })();
})();
</script>
</body>
</html>
