<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>数据中心 - 智能管理平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --neon-blue: #00f3ff;

  .tbody-container { overflow-x: auto; overflow-y: auto; max-height: 70vh; position: relative; }

<body>
<canvas id="particleCanvas"></canvas>

<script>
(function() {
  /* 粒子背景 */
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [], PARTICLE_COUNT = 150, centerX, centerY;
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; centerX = canvas.width / 2; centerY = canvas.height / 2; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  class Particle {
    constructor() { this.reset(true); }
    reset(initial) { const angle = Math.random() * Math.PI * 2; const distance = initial ? Math.random() * 50 : 10; this.x = centerX + Math.cos(angle) * distance; this.y = centerY + Math.sin(angle) * distance; const speed = 0.5 + Math.random() * 1.5; this.speedX = Math.cos(angle) * speed; this.speedY = Math.sin(angle) * speed; this.size = 0.5 + Math.random() * 2; this.opacity = 0.4 + Math.random() * 0.6; this.color = Math.random() > 0.5 ? 'rgba(0,243,255,' : 'rgba(255,255,255,'; }
    update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset(); }
    draw(ctx) { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = this.color + this.opacity + ')'; ctx.fill(); }
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
  function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100); gradient.addColorStop(0, 'rgba(0, 243, 255, 0.05)'); gradient.addColorStop(1, 'rgba(0, 243, 255, 0)'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(ctx); }); requestAnimationFrame(animateParticles); }
  animateParticles();

  /* 基础配置 */
  const SUPABASE_URL = "https://gbedtcwsnwteneiokizp.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6kqvIXFMeqXW-xmwh7GcHQ_LvfH2zon";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const SUPER_ADMIN_EMAIL = "liuping@vip.com";

  const PRESET_FUELS = [
    { gcode: "60518727", gname: "95号车用汽油(ⅥB)", label: "95汽油" },
    { gcode: "60518726", gname: "92号车用汽油(ⅥB)", label: "92汽油" },

  ];

  const T = {

      <div class="filter-bar">

        <button id="applyFilterBtn">🔍 查询</button>

      <div class="summary-inline" id="summaryInline">${T.summaryLoading}</div>
      <div class="table-fixed-header">
        <div class="thead-container" id="theadContainer"><table id="headerTable"><thead id="tableHead"></thead></table></div>
        <div class="tbody-container" id="tbodyContainer">

          <div class="empty-state" id="emptyMessage" style="display:none;">${T.noData}</div>
        </div>
      </div>
      <p id="dataError" class="error"></p>`;
    app.appendChild(dataSec);

    const thead = document.getElementById('tableHead');
    const tr = document.createElement('tr');
    T.tableHeaders.forEach(h => { const th = document.createElement('th'); th.textContent = h; tr.appendChild(th); });
    thead.appendChild(tr);
    const tbodyContainer = document.getElementById('tbodyContainer');
    const theadContainer = document.getElementById('theadContainer');

      tbodyContainer.addEventListener('scroll', () => { theadContainer.scrollLeft = tbodyContainer.scrollLeft; });

  function showLogin() {
    document.getElementById('loginSection').style.display = 'flex';
    document.getElementById('dataSection').style.display = 'none';
    const savedEmail = localStorage.getItem('supabase_saved_email');

  async function getCurrentUserRole() {

    if (user.email === SUPER_ADMIN_EMAIL) return 'super_admin';

  async function showData() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dataSection').style.display = 'block';
    allLogsCache = null; currentFilterStncode = ''; document.getElementById('stncodeFilter').value = '';
    await loadAvailableMonths(); await loadCurrentMonthData(); await updateUIByRole(); await updateTitleWithUser();
  }

    const { data: { user } } = await supabase.auth.getUser();
    const titleEl = document.getElementById('pageTitle');
    if (titleEl && user) titleEl.innerHTML = `${T.title} <span class="user-email-in-title">(${user.email})</span>`;
  }

  async function login() {
    const btn = document.getElementById('loginBtn'); const errEl = document.getElementById('loginError');
    const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value;
    errEl.textContent = '';

    if (!email.includes('@')) { errEl.textContent = '邮箱格式不正确'; return; }
    btn.disabled = true; btn.textContent = '验证中...'; showLoading('正在登录...');

      hideLoading(); errEl.textContent = T.loadErrorPrefix + (err.message || '未知错误');
      btn.disabled = false; btn.textContent = T.loginBtn;
    }
  }

  async function logout() { await supabase.auth.signOut(); showLogin(); allLogsCache = null; }

  /* 分页获取全部数据 */
  async function fetchAllLogs(force = false) {
    if (allLogsCache && !force) return allLogsCache;
    if (currentRequestController) currentRequestController.abort();
    currentRequestController = new AbortController();
    try {
      let allData = [];
      let from = 0;
      const batchSize = 1000;
      let fetchMore = true;
      while (fetchMore) {
        const { data, error } = await supabase
          .from('request_logs')
          .select('created_at, request_body')
          .order('created_at', { ascending: false })
          .range(from, from + batchSize - 1)
          .abortSignal(currentRequestController.signal);
        if (error) throw error;
        if (data && data.length > 0) {
          allData = allData.concat(data);
          from += batchSize;
          if (data.length < batchSize) fetchMore = false;
        } else {
          fetchMore = false;
        }
      }
      allLogsCache = allData;
      return allLogsCache;
    } catch (err) {
      if (err.name === 'AbortError') return allLogsCache || [];
      document.getElementById('dataError').textContent = '数据加载失败，请检查网络连接。';
      return [];
    }
  }

  function isToday(createdAt) { const today = new Date(); today.setHours(0,0,0,0); return new Date(createdAt) >= today; }
  function applyFilter(stncode) { if (!allLogsCache) return []; if (!stncode) return allLogsCache; return allLogsCache.filter(log => log.request_body?.stncode?.toString() === stncode.toString()); }

  async function updateGlobalStats() {
    if (!allLogsCache) return;
    const logs = currentFilterStncode ? applyFilter(currentFilterStncode) : allLogsCache;
    document.getElementById('totalCount').innerText = logs.length;
    document.getElementById('todayCount').innerText = logs.filter(log => isToday(log.created_at)).length;
  }

  async function loadAvailableMonths() {
    showLoading('正在加载月份...');
    const logs = await fetchAllLogs(); hideLoading();
    const months = new Set(); logs.forEach(l => { if (l.created_at) months.add(l.created_at.substring(0,7)); });
    const sorted = Array.from(months).sort().reverse(); const select = document.getElementById('monthSelect');
    if (monthSelectListener) select.removeEventListener('change', monthSelectListener);
    select.innerHTML = sorted.map(m => `<option value="${m}">${m}</option>`).join('');
    if (sorted.length > 0) { select.value = sorted[0]; await updateSummaryAndTable(sorted[0]); }
    else {
      select.innerHTML = '<option value="">无数据</option>';
      document.getElementById('summaryInline').textContent = T.siteSummaryNone;
      document.getElementById('emptyMessage').style.display = 'block';
    }
    monthSelectListener = async function() {
      const month = this.value;
      if (month === cachedMonth && currentFilterStncode === cachedFilter) return;
      cachedMonth = month; cachedFilter = currentFilterStncode;
      await updateSummaryAndTable(month);
    };
    select.addEventListener('change', monthSelectListener);
  }

  async function updateSummaryAndTable(month) {
    showLoading('加载数据中...');
    await fetchAllLogs();
    const logs = currentFilterStncode ? applyFilter(currentFilterStncode) : allLogsCache;
    renderSummary(month, logs);
    renderTable(month, logs);
    await updateGlobalStats();
    hideLoading();
  }

  function renderSummary(month, logs) {
    const counts = {};
    logs.forEach(l => { if (!l.created_at || l.created_at.substring(0,7) !== month) return; const code = l.request_body?.stncode; if (code) counts[code] = (counts[code]||0)+1; });
    const items = Object.entries(counts).map(([c, n]) => `${c}: <span style="color: var(--success); font-weight: bold;">${n}次</span>`).join(' | ');
    const summaryEl = document.getElementById('summaryInline');
    summaryEl.innerHTML = items ? `${T.summaryPrefix} (${month})：${items}` : `${T.summaryPrefix} (${month})：${T.siteSummaryNone}`;
  }

  function renderTable(month, logs) {
    const filtered = logs.filter(l => l.created_at?.substring(0,7) === month);
    const tbody = document.getElementById('tableBody'), emptyMsg = document.getElementById('emptyMessage');
    tbody.innerHTML = ''; if (filtered.length === 0) { emptyMsg.style.display = 'block'; return; }
    emptyMsg.style.display = 'none';
    const fragment = document.createDocumentFragment();
    filtered.forEach(row => {

      [body?.stncode, body?.shortname, body?.saleno, body?.gname, body?.mobilephone, body?.name, body?.ctc, body?.ttc,

      fragment.appendChild(tr);

    tbody.appendChild(fragment);

    document.body.appendChild(overlay);

        try { const { data, error } = await supabase.functions.invoke('reset-user-password', { method: 'POST', body: { userId, newPassword } }); if (error) throw new Error(error.message); if (data?.success) alert('密码重置成功！'); else throw new Error(data?.error || '未知错误'); } catch (err) { alert('重置失败：' + err.message); }
      } else if (target.classList.contains('delete-user-btn')) {
        const userId = target.dataset.userid; const email = target.dataset.email; if (email === SUPER_ADMIN_EMAIL) { alert('不允许删除超级管理员！'); return; }

  /* 批量创建账号（含孤儿清理） */

    try {

  /* ==================== 站点配置相关 ==================== */
  let stationsList = [], currentEditStationId = null;

  function parseFuelMappings(text) {
    const mappings = [];
    if (!text) return mappings;
    const parts = text.split(',');
    for (let i = 0; i < parts.length; i += 2) {
      const gcodePart = parts[i]?.trim();
      const gnamePart = parts[i+1]?.trim();
      if (gcodePart && gnamePart) {
        const gcode = gcodePart.replace('gcode:', '').trim();
        const gname = gnamePart.replace('gname:', '').trim();
        if (gcode && gname) mappings.push({ gcode, gname });
      }
    }
    return mappings;
  }
  function serializeFuelMappings(mappings) { return mappings.map(m => `gcode:${m.gcode},gname:${m.gname}`).join(','); }

  function syncPresetButtons(editorContainer) {
    const entries = editorContainer.querySelectorAll('.fuel-mapping-entry');
    const existingGcodes = new Set();
    entries.forEach(entry => {
      const gcodeInput = entry.querySelector('.fuel-gcode');
      if (gcodeInput) { const val = gcodeInput.value.trim(); if (val) existingGcodes.add(val); }
    });
    const presetBtns = editorContainer.querySelectorAll('.preset-fuel-btn');
    presetBtns.forEach(btn => {
      const gcode = btn.dataset.gcode;
      if (existingGcodes.has(gcode)) btn.classList.add('selected'); else btn.classList.remove('selected');
    });
  }

  function initFuelMappingEditor(container, initialText, isEnabled = true) {
    const entriesContainer = container.querySelector('#fuelMappingEntries');
    const presetContainer = container.querySelector('#fuelPresetButtons');
    if (!entriesContainer || !presetContainer) return;
    entriesContainer.innerHTML = '';
    const mappings = parseFuelMappings(initialText);
    if (mappings.length === 0) mappings.push({ gcode: '', gname: '' });
    renderFuelEntries(entriesContainer, mappings, isEnabled, container);
    if (!presetContainer.dataset.bound) {
      presetContainer.querySelectorAll('.preset-fuel-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          togglePresetFuel(entriesContainer, btn.dataset.gcode, btn.dataset.gname, isEnabled, container);
        });
      });
      presetContainer.dataset.bound = 'true';
    }
    syncPresetButtons(container);
  }

  function togglePresetFuel(entriesContainer, gcode, gname, isEnabled, editorContainer) {
    if (!isEnabled) return;
    const existing = entriesContainer.querySelectorAll('.fuel-mapping-entry');
    let found = null;
    existing.forEach(entry => {
      const gcodeInput = entry.querySelector('.fuel-gcode');
      if (gcodeInput && gcodeInput.value.trim() === gcode) found = entry;
    });
    if (found) found.remove();
    else addFuelEntry(entriesContainer, gcode, gname, isEnabled, false);
    syncPresetButtons(editorContainer);
  }

  function renderFuelEntries(container, mappings, isEnabled, editorContainer) {
    container.innerHTML = '';
    mappings.forEach(m => {
      const entryDiv = document.createElement('div'); entryDiv.className = 'fuel-mapping-entry';
      entryDiv.innerHTML = `<input type="text" placeholder="gcode" value="${m.gcode}" class="fuel-gcode" ${isEnabled ? '' : 'readonly'}><input type="text" placeholder="gname" value="${m.gname}" class="fuel-gname" ${isEnabled ? '' : 'readonly'}><button type="button" class="btn-remove-fuel" ${isEnabled ? '' : 'disabled'}>✕</button>`;
      container.appendChild(entryDiv);
    });
    if (isEnabled) {
      const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'mode-btn';
      addBtn.textContent = '+ 自定义油品'; addBtn.style.marginTop = '8px';
      addBtn.addEventListener('click', () => { addFuelEntry(container, '', '', true, true); if (editorContainer) syncPresetButtons(editorContainer); });
      container.appendChild(addBtn);
    }
    container.querySelectorAll('.btn-remove-fuel').forEach(btn => {
      btn.addEventListener('click', function(e) {
        if (!isEnabled) return;
        const entry = e.target.closest('.fuel-mapping-entry');
        if (entry) { entry.remove(); if (editorContainer) syncPresetButtons(editorContainer); }
      });
    });
  }

  function addFuelEntry(container, gcode, gname, isEnabled, shouldSync = true) {
    const entryDiv = document.createElement('div'); entryDiv.className = 'fuel-mapping-entry';
    entryDiv.innerHTML = `<input type="text" placeholder="gcode" value="${gcode}" class="fuel-gcode"><input type="text" placeholder="gname" value="${gname}" class="fuel-gname"><button type="button" class="btn-remove-fuel" ${isEnabled ? '' : 'disabled'}>✕</button>`;

  function getFuelMappingsFromEditor(container) {
    const entries = container.querySelectorAll('.fuel-mapping-entry');

    async function refreshStationList() {
      const { data, error } = await supabase.from('stations').select('id, stncode, shortname, startdate, enddate');
      if (!error && data) { stationsList = data; const container = document.getElementById('stationChecklist'); const today = new Date().toISOString().slice(0,10); container.innerHTML = stationsList.map(s => { const start = s.startdate ? s.startdate.slice(0,10) : ''; const end = s.enddate ? s.enddate.slice(0,10) : ''; const isEnabled = (start <= today && today <= end); return `<div class="station-item"><input type="checkbox" value="${s.id}" id="chk_${s.id}"><label for="chk_${s.id}">${s.stncode} - ${s.shortname} (区间: ${start||'无'} ~ ${end||'无'}) ${isEnabled ? '✅启用中' : '❌已禁用'}</label></div>`; }).join(''); }
    }
    const todayStr = new Date().toISOString().slice(0,10), farFuture = '2099-12-31'; const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1); const yesterdayStr = yesterday.toISOString().slice(0,10);
    document.getElementById('enableAllBtn').onclick = async () => { if (await updateStationsDates(stationsList.map(s=>s.id), todayStr, farFuture)) await refreshStationList(); };
    document.getElementById('disableAllBtn').onclick = async () => { if (await updateStationsDates(stationsList.map(s=>s.id), null, yesterdayStr)) await refreshStationList(); };
    document.getElementById('enableSelectedBtn').onclick = async () => { const ids = getSelectedIds(); if (!ids.length) alert('请先勾选'); else if (await updateStationsDates(ids, todayStr, farFuture)) await refreshStationList(); };
    document.getElementById('disableSelectedBtn').onclick = async () => { const ids = getSelectedIds(); if (!ids.length) alert('请先勾选'); else if (await updateStationsDates(ids, null, yesterdayStr)) await refreshStationList(); };
    document.getElementById('applyDateToSelected').onclick = async () => { const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value; if (!start || !end) { alert('请填写完整日期'); return; } const ids = getSelectedIds(); if (!ids.length) { alert('请先勾选站点'); return; } if (await updateStationsDates(ids, start, end)) await refreshStationList(); };
    document.getElementById('applyDateToAll').onclick = async () => { const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value; if (!start || !end) { alert('请填写完整日期'); return; } if (await updateStationsDates(stationsList.map(s=>s.id), start, end)) await refreshStationList(); };
  }

  /* 事件绑定 */
  function bindEvents() {
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('togglePwd').addEventListener('click', togglePasswordVisibility);
    document.getElementById('adminBtn').addEventListener('click', showAdminPanel);
    document.getElementById('batchCreateBtn').addEventListener('click', batchCreateAccounts);
    document.getElementById('configBtn').addEventListener('click', showStationConfig);
    let filterTimeout;
    document.getElementById('stncodeFilter').addEventListener('input', function(e) {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(() => {
        currentFilterStncode = e.target.value.trim();
        allLogsCache = null;
        updateSummaryAndTable(document.getElementById('monthSelect').value);
      }, 300);
    });
    document.getElementById('applyFilterBtn').onclick = async () => {
      currentFilterStncode = document.getElementById('stncodeFilter').value.trim();
      allLogsCache = null;
      await updateSummaryAndTable(document.getElementById('monthSelect').value);
    };
    document.getElementById('resetFilterBtn').onclick = async () => {
      document.getElementById('stncodeFilter').value = ''; currentFilterStncode = ''; allLogsCache = null;
      await updateSummaryAndTable(document.getElementById('monthSelect').value);
    };
  }

  buildUI(); bindEvents();
  (async function init() { const { data: { session } } = await supabase.auth.getSession(); if (session) await showData(); else showLogin(); })();
})();
</script>
