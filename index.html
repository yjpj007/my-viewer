<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>数据中心 - 智能管理平台</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; report-uri /csp-report">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #b300ff;
            --neon-cyan: #00e5ff;
            --neon-magenta: #d400ff;
            --dark-bg: #0d1230;
            --panel-bg: rgba(15,20,45,0.85);
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.3);
            --text-primary: #e0f7fa;
            --text-secondary: #80deea;
            --accent: #00e5ff;
            --danger: #ff1744;
            --success: #00e676;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.5);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', '微软雅黑', sans-serif;
            --table-data-color: #c0c0c0;
            --table-data-hover-color: #e0e0e0;
            --login-card-bg: rgba(18,22,50,0.88);
            --login-border: rgba(0, 243, 255, 0.4);
            --login-glow-strong: 0 0 30px rgba(0, 195, 255, 0.5), 0 0 60px rgba(179, 0, 255, 0.3);
            --login-glow-subtle: 0 0 15px rgba(0, 243, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1a1f3a 0%, #0d1230 55%, #080a1a 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 3px,
                    rgba(0, 180, 255, 0.025) 3px,
                    rgba(0, 180, 255, 0.025) 5px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 60px,
                    rgba(179, 0, 255, 0.02) 60px,
                    rgba(179, 0, 255, 0.02) 61px);
            pointer-events: none;
            z-index: 0;
            animation: dataFlowShift 20s linear infinite;
        }

        @keyframes dataFlowShift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 60px, 30px 0; }
        }

        body::after {
            content: "";
            position: fixed;
            top: -30%;
            left: -20%;
            width: 140%;
            height: 160%;
            background:
                radial-gradient(ellipse at 25% 30%, rgba(0, 180, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 20%, rgba(140, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 70%, rgba(0, 220, 255, 0.1) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 75%, rgba(180, 0, 255, 0.08) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            animation: geomBreath 12s ease-in-out infinite;
        }

        @keyframes geomBreath {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            30% { opacity: 1; transform: scale(1.06); }
            60% { opacity: 0.5; transform: scale(0.95); }
            85% { opacity: 0.85; transform: scale(1.03); }
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .loading-overlay, .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }
        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.18);
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-container { width: 300px; text-align: center; }
        .progress-message { color: white; font-size: 16px; margin-bottom: 15px; letter-spacing: 1px; }
        .progress-bar-bg { background: rgba(255, 255, 255, 0.12); border-radius: 10px; overflow: hidden; height: 10px; margin-bottom: 8px; }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00cfff, #b300ff);
            transition: width 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0, 200, 255, 0.6);
        }
        .progress-percent { color: white; font-size: 13px; }

        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .login-wrapper {
            position: relative;
            perspective: 1000px;
            animation: loginWrapperIn 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }
        @keyframes loginWrapperIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.88); }
            60% { opacity: 1; transform: translateY(-6px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,0.15) 0%, rgba(140,0,255,0.1) 30%, transparent 70%);
            pointer-events: none;
            animation: auraPulse 4s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes auraPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
        }

        .login-geom-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 1.5px dashed rgba(0,220,255,0.35);
            pointer-events: none;
            z-index: 0;
            animation: ringRotate 25s linear infinite;
        }
        .login-geom-ring:nth-child(3) {
            width: 380px; height: 380px;
            border-color: rgba(179,0,255,0.28);
            animation-duration: 30s;
            animation-direction: reverse;
            border-style: dotted;
        }
        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: var(--login-card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--login-border);
            border-radius: 22px;
            padding: 44px 34px 38px;
            width: 420px;
            max-width: 92vw;
            box-shadow: var(--login-glow-strong), 0 25px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
            text-align: center;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
        }
        .login-box:hover {
            box-shadow: 0 0 40px rgba(0,200,255,0.55), 0 0 80px rgba(140,0,255,0.35), 0 25px 55px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
            border-color: rgba(0,240,255,0.6);
        }
        .login-box::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg,
                transparent 0deg, rgba(0,220,255,0.04) 30deg, transparent 60deg,
                rgba(179,0,255,0.04) 120deg, transparent 150deg,
                rgba(0,220,255,0.03) 210deg, transparent 240deg,
                rgba(140,0,255,0.03) 300deg, transparent 330deg);
            pointer-events: none;
            z-index: 0;
            animation: innerSweep 8s linear infinite;
            border-radius: 22px;
        }
        @keyframes innerSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .login-box > * { position: relative; z-index: 1; }

        .login-box h3 {
            font-size: 2rem; letter-spacing: 5px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #00e5ff 0%, #7dd8ff 25%, #c084fc 50%, #60a5fa 75%, #00e5ff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 5s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(0,220,255,0.5));
        }
        @keyframes titleGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .login-subtitle {
            font-size: 0.78rem; color: rgba(180,210,230,0.7); letter-spacing: 3px; margin-bottom: 28px;
            text-transform: uppercase; animation: subtitleFadeIn 1s 0.3s ease forwards; opacity: 0;
        }
        @keyframes subtitleFadeIn { to { opacity: 1; } }

        .login-input-group {
            position: relative; margin: 14px 0; animation: inputSlideIn 0.6s ease forwards; opacity: 0;
        }
        .login-input-group:nth-child(4) { animation-delay: 0.15s; }
        .login-input-group:nth-child(5) { animation-delay: 0.3s; }
        @keyframes inputSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .login-box input[type="email"],
        .login-box input[type="password"],
        .login-box input[type="text"] {
            width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; color: #fff;
            font-size: 15px; outline: none; transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
            font-family: var(--font-family); letter-spacing: 0.5px;
        }
        .login-box input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 16px rgba(0,220,255,0.45), 0 0 32px rgba(0,200,255,0.2), inset 0 0 8px rgba(0,220,255,0.06);
            background: rgba(255,255,255,0.09); transform: translateY(-1px);
        }
        .login-box input::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        .login-input-group::after {
            content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            border-radius: 2px; transition: width 0.4s ease; pointer-events: none;
        }
        .login-input-group:focus-within::after { width: 85%; }

        .password-wrapper { position: relative; margin: 0; }
        .password-wrapper input { padding-right: 48px !important; margin: 0 !important; }
        .password-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-secondary); font-size: 1.2rem; cursor: pointer;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; padding: 0; border-radius: 50%; z-index: 1;
        }
        .password-toggle:hover {
            color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);
            background: rgba(0,220,255,0.14); border-color: var(--neon-cyan);
            box-shadow: 0 0 14px rgba(0,220,255,0.3);
        }

        .remember-row {
            display: flex; align-items: center; margin-top: 16px; color: var(--text-secondary);
            font-size: 0.85rem; gap: 8px; animation: inputSlideIn 0.6s 0.45s ease forwards; opacity: 0;
        }
        .remember-row input[type="checkbox"] { accent-color: var(--neon-cyan); width: 16px; height: 16px; cursor: pointer; }
        .remember-row label { cursor: pointer; user-select: none; }

        .login-box button[type="button"].login-submit-btn {
            width: 100%; padding: 14px; margin-top: 22px;
            background: linear-gradient(135deg, rgba(0,200,255,0.15) 0%, rgba(140,0,255,0.15) 100%);
            border: 2px solid var(--neon-cyan); color: #fff; font-size: 17px; font-weight: 700;
            letter-spacing: 4px; border-radius: 10px; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1); text-transform: uppercase;
            position: relative; overflow: hidden; animation: inputSlideIn 0.6s 0.55s ease forwards; opacity: 0;
        }
        .login-box button[type="button"].login-submit-btn::before {
            content: ""; position: absolute; top: -2px; left: -100%; width: 100%; height: calc(100% + 4px);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease; z-index: 0; border-radius: 10px;
        }
        .login-box button[type="button"].login-submit-btn:hover:not(:disabled)::before { left: 100%; }
        .login-box button[type="button"].login-submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0,210,255,0.35) 0%, rgba(160,0,255,0.35) 100%);
            border-color: #fff; box-shadow: 0 0 28px rgba(0,220,255,0.7), 0 0 50px rgba(140,0,255,0.5), 0 8px 25px rgba(0,0,0,0.5);
            color: #fff; transform: translateY(-2px); letter-spacing: 6px;
        }
        .login-box button[type="button"].login-submit-btn:active { transform: scale(0.96); transition: transform 0.1s; }
        .login-box button[type="button"].login-submit-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.5); letter-spacing: 4px; }

        #loginError {
            color: var(--danger); margin-top: 15px; font-size: 13px; text-shadow: 0 0 8px var(--danger);
            min-height: 20px; position: relative; z-index: 1; letter-spacing: 1px; animation: errorShake 0.5s ease;
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* ==================== 数据区域 ==================== */
        #dataSection { animation: fadeIn 0.5s ease; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
        .title {
            font-size: 1.8rem; font-weight: 600; letter-spacing: 2px; display: inline-block;
            background: linear-gradient(to bottom, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000, #ff7f00);
            background-size: 100% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: rainbowFlow 8s linear infinite; will-change: background-position; transform: translateZ(0);
        }
        @keyframes rainbowFlow { 0% { background-position: 0% 0%; } 100% { background-position: 0% 200%; } }
        .user-email-in-title { font-size: 0.9rem; color: var(--text-secondary); margin-left: 12px; font-weight: normal; -webkit-text-fill-color: #80deea; }
        .logout-btn, .admin-btn, .config-btn { background: transparent; padding: 8px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px; }
        .logout-btn { border: 2px solid var(--danger); color: var(--danger); }
        .logout-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px var(--danger); }
        .admin-btn { border-color: var(--neon-blue); color: var(--neon-blue); margin-right: 10px; }
        .admin-btn:hover { background: var(--neon-blue); color: #0a0a0f; box-shadow: 0 0 20px var(--neon-blue); }
        .config-btn { border-color: var(--success); color: var(--success); margin-right: 10px; }
        .config-btn:hover { background: var(--success); color: #0a0a0f; box-shadow: 0 0 20px var(--success); }
        .logout-btn:active, .admin-btn:active, .config-btn:active { transform: scale(0.95); }

        .top-bar { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; margin-bottom: 16px; }
        .stats-grid { display: flex; gap: 15px; flex: 2; }
        .stat-card {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 0; text-align: center; box-shadow: var(--border-glow);
            transition: box-shadow 0.2s; white-space: nowrap; flex: 1; min-width: 130px; height: 80px;
            perspective: 800px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .stat-card .flip-card {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; flex-shrink: 0;
        }
        .stat-card.flipped .flip-card { transform: rotateY(180deg); }
        .stat-card .flip-card-front, .stat-card .flip-card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px;
        }
        .stat-card .flip-card-back { transform: rotateY(180deg); }
        .stat-card .label { font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 4px; }
        .stat-card .number { font-size: 2rem; font-weight: bold; color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); line-height: 1.2; }
        .stat-card:hover { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
        .month-selector-inline {
            background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 10px 20px; flex: 1; min-width: 130px; box-shadow: var(--border-glow);
            transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .month-selector-inline:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
        .month-selector-inline label { font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 1px; white-space: nowrap; }
        .month-selector-inline select {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 8px;
            color: white; padding: 8px 14px; font-size: 0.9rem; width: 100%; max-width: 160px;
        }
        select option { background-color: #1e293b !important; color: #ffffff !important; }
        .filter-bar {
            display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
            background: rgba(0,0,0,0.2); padding: 10px 14px; border-radius: 20px; backdrop-filter: blur(4px); margin-bottom: 16px;
        }
        .filter-bar .filter-input { flex: 2; min-width: 180px; }
        .filter-bar label { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-secondary); letter-spacing: 1px; }
        .filter-bar input, .filter-bar button { height: 42px; padding: 0 14px; line-height: 42px; font-size: 0.9rem; box-sizing: border-box; }
        .filter-bar input { width: 100%; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 8px; color: white; }
        .filter-bar button { background: var(--neon-blue); color: #0a0a0f; font-weight: bold; cursor: pointer; width: auto; border: none; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
        .filter-bar button:hover { box-shadow: 0 0 15px var(--neon-blue); }
        .filter-bar button:active { transform: scale(0.95); }
        .filter-bar .live-clock { font-size: 0.8rem; color: var(--neon-blue); white-space: nowrap; letter-spacing: 1px; font-weight: bold; text-shadow: 0 0 8px var(--neon-blue); line-height: 1.4; }
        .summary-inline {
            background: rgba(0, 243, 255, 0.1); border-radius: 40px; padding: 8px 20px;
            font-size: 0.85rem; color: var(--neon-blue); margin-bottom: 20px; word-break: break-word;
            border-left: 4px solid var(--neon-blue);
        }
        .table-fixed-header { background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; box-shadow: var(--border-glow), 0 10px 30px rgba(0,0,0,0.6); }
        .thead-container { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
        .thead-container::-webkit-scrollbar { display: none; }
        .thead-container table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
        .tbody-container { overflow-x: auto; overflow-y: auto; max-height: 60vh; position: relative; }
        .tbody-container table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1000px; }
        th, td { padding: 12px 8px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { background: rgba(0,243,255,0.2); font-size: 14px; font-weight: 600; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--neon-blue); cursor: pointer; user-select: none; }
        th.sort-asc::after { content: " ▲"; }
        th.sort-desc::after { content: " ▼"; }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px; color: var(--table-data-color); }
        .tbody-container tr:hover td { background: rgba(0,243,255,0.08); color: var(--table-data-hover-color); }
        .pagination-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 15px 0; }
        .pagination-bar button { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .pagination-bar button:disabled { opacity: 0.4; cursor: default; }
        .pagination-bar span { color: var(--text-secondary); font-size: 0.9rem; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }

            // 粒子系统（全屏均匀散布，约30fps限制）
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [], PARTICLE_COUNT = 180, isPageVisible = true, lastFrameTime = 0;

            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() { this.reset(true); }
                reset(initial) {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.4 + Math.random() * 1.8;
                    this.speedX = Math.cos(angle) * speed;
                    this.speedY = Math.sin(angle) * speed;
                    this.size = 0.4 + Math.random() * 2.2;
                    this.opacity = 0.3 + Math.random() * 0.7;
                    this.color = Math.random() > 0.35 ? 'rgba(0,220,255,' : 'rgba(200,180,255,';
                    this.twinkleSpeed = 0.01 + Math.random() * 0.03;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < -20 || this.x > canvas.width + 20 || this.y < -20 || this.y > canvas.height + 20) this.reset();
                    this.twinkleOffset += this.twinkleSpeed;
                }
                draw(ctx) {
                    const currentOpacity = this.opacity * (0.55 + 0.45 * Math.sin(this.twinkleOffset));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fillStyle = this.color + currentOpacity + ')';
                    ctx.fill();
                    if (this.size > 1.5 && currentOpacity > 0.5) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI*2);
                        ctx.fillStyle = this.color + (currentOpacity * 0.2) + ')';
                        ctx.fill();
                    }
                }
            }
            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

            function animateParticles(timestamp) {
                if (!isPageVisible) { requestAnimationFrame(animateParticles); return; }
                if (timestamp - lastFrameTime < 33) { requestAnimationFrame(animateParticles); return; }
                lastFrameTime = timestamp;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerX = canvas.width/2, centerY = canvas.height/2;
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 180);
                gradient.addColorStop(0, 'rgba(0,200,255,0.04)');
                gradient.addColorStop(0.5, 'rgba(100,0,200,0.02)');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0,0,canvas.width,canvas.height);
                particles.forEach(p => { p.update(); p.draw(ctx); });

            function createAbortController() {
                if (activeAbortController) activeAbortController.abort();
                activeAbortController = new AbortController();
                return activeAbortController;
            }

            async function fetchAllTimestamps() {
                if (allTimestamps.length) return allTimestamps;
                const controller = createAbortController();
                let allData = []; let from = 0; const batchSize = 1000;
                while (true) {
                    const { data, error } = await supabase.from('request_logs').select('created_at, request_body')
                        .order('created_at', { ascending: false }).range(from, from + batchSize - 1).abortSignal(controller.signal);
                    if (error) throw error;
                    if (data && data.length > 0) {
                        allData = allData.concat(data.map(d => ({ created_at: d.created_at, stncode: d.request_body?.stncode || '' })));
                        from += batchSize;
                        if (data.length < batchSize) break;
                    } else break;
                }
                allTimestamps = allData;
                return allTimestamps;
            }

            async function fetchMonthLogs(month) {
                const controller = createAbortController();
                const startDate = `${month}-01`;
                const [year, mon] = month.split('-').map(Number);
                const nextMonth = mon === 12 ? `${year+1}-01` : `${year}-${String(mon+1).padStart(2,'0')}`;
                const endDate = `${nextMonth}-01`;
                let allData = []; let from = 0; const batchSize = 1000;
                while (true) {
                    const query = supabase.from('request_logs').select('created_at, request_body')
                        .gte('created_at', startDate).lt('created_at', endDate)
                        .order('created_at', { ascending: false }).range(from, from + batchSize - 1).abortSignal(controller.signal);
                    const { data, error } = await query;
                    if (error) throw error;
                    if (data && data.length > 0) { allData = allData.concat(data); from += batchSize; if (data.length < batchSize) break; }
                    else break;
                }
                return allData;
            }

            function getFilteredLogs() {
                if (!currentMonthLogs) return [];
                if (!currentFilterStncode) return currentMonthLogs;
                return currentMonthLogs.filter(log => log.request_body?.stncode?.toString() === currentFilterStncode.toString());
            }

            function updateGlobalStats() {
                let frontData = currentMonthLogs || [];
                if (currentFilterStncode) frontData = frontData.filter(log => log.request_body?.stncode?.toString() === currentFilterStncode);
                document.getElementById('totalCountFront').innerText = frontData.length;
                let backData = allTimestamps || [];
                if (currentFilterStncode) backData = backData.filter(item => item.stncode === currentFilterStncode);
                document.getElementById('totalCountBack').innerText = backData.length;
                const today = new Date(); today.setHours(0,0,0,0);
                const todayCount = frontData.filter(log => new Date(log.created_at) >= today).length;
                document.getElementById('todayCount').innerText = todayCount;
            }

            async function loadAvailableMonths() {
                if (!allTimestamps.length) await fetchAllTimestamps(); // 避免重复请求
                const months = new Set();
                allTimestamps.forEach(l => { if (l.created_at) months.add(l.created_at.substring(0,7)); });
                const sorted = Array.from(months).sort().reverse();
                const select = document.getElementById('monthSelect');
                select.innerHTML = sorted.map(m => `<option value="${m}">${m}</option>`).join('');
                if (sorted.length > 0) { select.value = sorted[0]; }
                else { select.innerHTML = '<option value="">无数据</option>'; document.getElementById('summaryInline').textContent = T.siteSummaryNone; }
            }

            async function loadMonthData(month, showLoader = true) {
                if (!month) return;
                if (showLoader) showLoading('加载数据中...');
                try {
                    currentMonthLogs = await fetchMonthLogs(month);
                    currentPage = 1;
                    renderSummary(month);
                    renderTable();
                    updateGlobalStats();
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    document.getElementById('dataError').innerHTML = `${escapeHtml('数据加载失败：' + err.message)} <button class="retry-btn" id="retryMonthBtn">重试</button>`;
                    document.getElementById('retryMonthBtn').addEventListener('click', () => {
                        document.getElementById('dataError').innerHTML = '';
                        loadMonthData(month);
                    });
                } finally {
                    if (showLoader) hideLoading();
                }
            }

            function renderSummary(month) {
                const logs = getFilteredLogs();
                const counts = {};
                logs.forEach(l => { const code = l.request_body?.stncode; if (code) counts[code] = (counts[code]||0)+1; });
                const items = Object.entries(counts).map(([c,n]) => `${escapeHtml(c)}: <span style="color:var(--success);font-weight:bold;">${n}次</span>`).join(' | ');
                document.getElementById('summaryInline').innerHTML = items ? `${T.summaryPrefix} (${month})：${items}` : `${T.summaryPrefix} (${month})：${T.siteSummaryNone}`;
            }

            function sortTable(colIndex) {
                if (currentSort.col === colIndex) currentSort.asc = !currentSort.asc;
                else { currentSort.col = colIndex; currentSort.asc = true; }
                currentPage = 1;
                renderTable();
            }

            function renderTable() {
                const filtered = getFilteredLogs();
                const tbody = document.getElementById('tableBody'), emptyMsg = document.getElementById('emptyMessage');
                tbody.innerHTML = '';
                if (filtered.length === 0) { emptyMsg.style.display = 'block'; renderPagination(0); return; }
                emptyMsg.style.display = 'none';
                let sorted = [...filtered];
                if (currentSort.col !== null) {
                    const asc = currentSort.asc;
                    sorted.sort((a,b) => {
                        const bodyA = a.request_body, bodyB = b.request_body;
                        let valA, valB;
                        switch(currentSort.col) {
                            case 0: valA=bodyA?.stncode||''; valB=bodyB?.stncode||''; break;
                            case 1: valA=bodyA?.shortname||''; valB=bodyB?.shortname||''; break;
                            case 2: valA=bodyA?.saleno||''; valB=bodyB?.saleno||''; break;
                            case 3: valA=bodyA?.gname||''; valB=bodyB?.gname||''; break;
                            case 4: valA=bodyA?.mobilephone||''; valB=bodyB?.mobilephone||''; break;
                            case 5: valA=bodyA?.name||''; valB=bodyB?.name||''; break;
                            case 6: valA=bodyA?.ctc||''; valB=bodyB?.ctc||''; break;
                            case 7: valA=bodyA?.ttc||''; valB=bodyB?.ttc||''; break;
                            case 8: valA=bodyA?.questiondata?.length ? bodyA.questiondata[bodyA.questiondata.length-1].answercontent : ''; valB=bodyB?.questiondata?.length ? bodyB.questiondata[bodyB.questiondata.length-1].answercontent : ''; break;
                            case 9: valA=a.created_at||''; valB=b.created_at||''; break;
                            default: return 0;
                        }
                        if (valA < valB) return asc ? -1 : 1;
                        if (valA > valB) return asc ? 1 : -1;
                        return 0;
                    });
                }
                const totalPages = Math.ceil(sorted.length / T.pageSize);
                if (currentPage > totalPages) currentPage = totalPages || 1;
                const start = (currentPage-1) * T.pageSize;
                const pageData = sorted.slice(start, start+T.pageSize);
                const fragment = document.createDocumentFragment();
                pageData.forEach(row => {
                    const body = row.request_body; const tr = document.createElement('tr');
                    [body?.stncode, body?.shortname, body?.saleno, body?.gname, body?.mobilephone, body?.name,
                     body?.ctc, body?.ttc, (body?.questiondata?.length ? body.questiondata[body.questiondata.length-1].answercontent : ''), row.created_at]
                    .forEach(v => { const td = document.createElement('td'); td.textContent = v || ''; if (v && v.length > 15) td.title = v; tr.appendChild(td); });
                    fragment.appendChild(tr);
                });
                tbody.appendChild(fragment);
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                const bar = document.getElementById('paginationBar'); bar.innerHTML = '';
                if (totalPages <= 1) return;
                const prevBtn = document.createElement('button'); prevBtn.textContent = '上一页'; prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener('click', () => { if (currentPage>1) { currentPage--; renderTable(); } });
                const nextBtn = document.createElement('button'); nextBtn.textContent = '下一页'; nextBtn.disabled = currentPage === totalPages;
                nextBtn.addEventListener('click', () => { if (currentPage<totalPages) { currentPage++; renderTable(); } });
                const span = document.createElement('span'); span.textContent = `${currentPage} / ${totalPages}`;
                bar.appendChild(prevBtn); bar.appendChild(span); bar.appendChild(nextBtn);
            }

            function parseFuelMappings(text) { const mappings = []; if (!text) return mappings; const parts = text.split(','); for (let i = 0; i < parts.length; i += 2) { const gcodePart = parts[i]?.trim(); const gnamePart = parts[i+1]?.trim(); if (gcodePart && gnamePart) { const gcode = gcodePart.replace('gcode:', '').trim(); const gname = gnamePart.replace('gname:', '').trim(); if (gcode && gname) mappings.push({ gcode, gname }); } } return mappings; }
            function serializeFuelMappings(mappings) { return mappings.map(m => `gcode:${m.gcode},gname:${m.gname}`).join(','); }

            class FuelMappingEditor {
                constructor(container, initialValue = '', enabled = true) { this.container = container; this.enabled = enabled; this._build(initialValue); }
                _build(initialValue) {
                    this.container.innerHTML = '';
                    const presetDiv = document.createElement('div'); presetDiv.style.display = 'flex'; presetDiv.style.gap = '4px'; presetDiv.style.flexWrap = 'nowrap'; presetDiv.style.overflowX = 'auto'; presetDiv.style.marginBottom = '6px';
                    PRESET_FUELS.forEach(f => {
                        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'fuel-preset-btn preset-fuel-btn'; btn.textContent = f.label;
                        btn.addEventListener('click', () => { if (!this.enabled) return; this._togglePreset(btn, f.gcode, f.gname); });
                        presetDiv.appendChild(btn); btn._fuelData = { gcode: f.gcode, gname: f.gname };
                    });
                    const entriesDiv = document.createElement('div'); entriesDiv.className = 'fuel-entries'; this.entriesDiv = entriesDiv;
                    this.container.appendChild(presetDiv); this.container.appendChild(entriesDiv);
                    const mappings = parseFuelMappings(initialValue);
                    if (mappings.length === 0) mappings.push({ gcode: '', gname: '' });
                    mappings.forEach(m => this._addEntry(m.gcode, m.gname));
                    const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'mode-btn'; addBtn.textContent = '+ 自定义油品'; addBtn.style.marginTop = '8px';
                    addBtn.addEventListener('click', () => { if (this.enabled) this._addEntry('', ''); });
                    this.addBtn = addBtn; entriesDiv.appendChild(addBtn); this._syncPresetButtons(); this._applyEnabledState();
                }
                _addEntry(gcode, gname) {
                    const entryDiv = document.createElement('div'); entryDiv.className = 'fuel-mapping-entry';
                    entryDiv.innerHTML = `<input type="text" placeholder="gcode" value="${escapeHtml(gcode)}" class="fuel-gcode"><input type="text" placeholder="gname" value="${escapeHtml(gname)}" class="fuel-gname"><button type="button" class="btn-remove-fuel">✕</button>`;
                    entryDiv.querySelector('.btn-remove-fuel').addEventListener('click', () => { entryDiv.remove(); this._syncPresetButtons(); });
                    this.entriesDiv.insertBefore(entryDiv, this.addBtn); this._syncPresetButtons();
                }
                _togglePreset(btn, gcode, gname) {
                    const existing = Array.from(this.entriesDiv.querySelectorAll('.fuel-gcode')).find(inp => inp.value.trim() === gcode);
                    if (existing) { existing.closest('.fuel-mapping-entry').remove(); } else { this._addEntry(gcode, gname); }
                    this._syncPresetButtons();
                }
                _syncPresetButtons() {
                    const existingGcodes = new Set(); this.entriesDiv.querySelectorAll('.fuel-gcode').forEach(inp => { if (inp.value.trim()) existingGcodes.add(inp.value.trim()); });
                    this.container.querySelectorAll('.preset-fuel-btn').forEach(btn => { if (existingGcodes.has(btn._fuelData.gcode)) { btn.classList.add('selected'); } else { btn.classList.remove('selected'); } });
                }
                _applyEnabledState() {
                    const inputs = this.entriesDiv.querySelectorAll('input'); const removeBtns = this.entriesDiv.querySelectorAll('.btn-remove-fuel'); const presetBtns = this.container.querySelectorAll('.preset-fuel-btn');
                    inputs.forEach(inp => { inp.readOnly = !this.enabled; }); removeBtns.forEach(btn => { btn.disabled = !this.enabled; btn.style.opacity = this.enabled ? '1' : '0.5'; });
                    presetBtns.forEach(btn => { btn.style.pointerEvents = this.enabled ? 'auto' : 'none'; btn.style.opacity = this.enabled ? '1' : '0.5'; });
                    this.addBtn.style.display = this.enabled ? 'inline-flex' : 'none';
                }
                setEnabled(enabled) { this.enabled = enabled; this._applyEnabledState(); }
                getMappings() { const mappings = []; this.entriesDiv.querySelectorAll('.fuel-mapping-entry').forEach(entry => { const gcode = entry.querySelector('.fuel-gcode').value.trim(); const gname = entry.querySelector('.fuel-gname').value.trim(); if (gcode && gname) mappings.push({ gcode, gname }); }); return mappings; }
            }

            class CardnoEditor {
                constructor(container, initialValue = '', enabled = true) { this.container = container; this.enabled = enabled; this._build(initialValue); }
                _build(initialValue) {
                    this.container.innerHTML = ''; const entriesDiv = document.createElement('div'); entriesDiv.className = 'cardno-entries'; this.entriesDiv = entriesDiv; this.container.appendChild(entriesDiv);
                    const cards = initialValue ? initialValue.split(',').map(s => s.trim()).filter(Boolean) : []; if (cards.length === 0) for (let i = 0; i < 4; i++) cards.push('');
                    cards.forEach(card => this._addEntry(card));
                    const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'mode-btn'; addBtn.textContent = '+ 添加卡号'; addBtn.style.marginTop = '8px';
                    addBtn.addEventListener('click', () => { if (this.enabled) this._addEntry(''); });
                    this.addBtn = addBtn; entriesDiv.appendChild(addBtn); this._applyEnabledState();
                }
                _addEntry(value) {
                    const entryDiv = document.createElement('div'); entryDiv.className = 'cardno-entry';
                    entryDiv.innerHTML = `<input type="text" placeholder="卡号" value="${escapeHtml(value)}" class="cardno-input"><button type="button" class="btn-remove-cardno">✕</button>`;
                    entryDiv.querySelector('.btn-remove-cardno').addEventListener('click', () => entryDiv.remove());
                    this.entriesDiv.insertBefore(entryDiv, this.addBtn);
                }
                _applyEnabledState() {
                    const inputs = this.entriesDiv.querySelectorAll('input'); const removeBtns = this.entriesDiv.querySelectorAll('.btn-remove-cardno');
                    inputs.forEach(inp => { inp.readOnly = !this.enabled; }); removeBtns.forEach(btn => { btn.disabled = !this.enabled; btn.style.opacity = this.enabled ? '1' : '0.5'; });
                    this.addBtn.style.display = this.enabled ? 'inline-flex' : 'none';
                }
                setEnabled(enabled) { this.enabled = enabled; this._applyEnabledState(); }
                getCards() { return Array.from(this.entriesDiv.querySelectorAll('.cardno-input')).map(inp => inp.value.trim()).filter(Boolean); }
            }

            let stationsList = [], currentEditStationId = null;
            let fuelLocked = true, cardnoLocked = true;

            async function showStationConfig() {
                const role = await getCurrentUserRole();
                if (role !== 'super_admin') { showToast('权限不足'); return; }
                const { data: { session } } = await supabase.auth.getSession(); if (!session) { showToast('请先登录'); return; }
                showLoading('正在加载站点列表...');
                try {
                    const { data, error } = await supabase.from('stations').select('id, stncode, shortname, startdate, enddate');

                    stationsList = data || [];
                } catch (err) { hideLoading(); showToast('加载站点列表失败: ' + err.message); return; }
                hideLoading();
                const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                <div class="modal" role="dialog" aria-modal="true">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin:0;">站点数据配置</h3>
                        <div><button id="batchCreateInConfigBtn" class="btn-primary" style="margin-right:10px;">批量生成账号</button><span class="close-btn" id="closeConfigModal" aria-label="关闭">&times;</span></div>

                    <div class="mode-switch"><div id="tabEdit" class="mode-btn active">编辑站点</div><div id="tabCreate" class="mode-btn">新增站点</div><div id="tabBatch" class="mode-btn">批量启用/禁用</div></div>
                    <div id="panelEdit" class="panel active">
                        <div class="field-row"><label for="stationSelect">选择站点：</label><select id="stationSelect"><option value="">-- 请选择站点 --</option>${stationsList.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.stncode)} - ${escapeHtml(s.shortname)}</option>`).join('')}</select></div>
                        <div class="field-row"><label>交易组织代码</label><input type="text" id="transactionorgcode"></div>
                        <div class="field-group"><div class="field-row"><label>已用次数</label><input type="number" id="usedcount"></div><div class="field-row"><label>每日次数</label><input type="number" id="count"></div></div>
                        <div class="field-group"><div class="field-row"><label>开始日期</label><input type="date" id="startdate"></div><div class="field-row"><label>结束日期</label><input type="date" id="enddate"></div></div>
                        <div class="field-row"><label>最后重置日期</label><input type="date" id="lastresetdate"></div>
                        <div class="field-row"><label>关联用户ID</label><input type="text" id="user_id" placeholder="UUID"></div>
                        <div class="fuel-section"><label>油品映射 <span class="lock-icon" id="lockFuelEdit" title="锁定/解锁编辑">🔒</span></label><div class="fuel-editor-container" id="editFuelMappingEditor"></div></div>
                        <div class="cardno-section"><label>卡号数组 <span class="lock-icon" id="lockCardnoEdit" title="锁定/解锁编辑">🔒</span></label><div class="cardno-editor-container" id="editCardnoEditor"></div></div>
                        <div class="edit-create-footer"><button id="deleteStationBtn" class="btn-danger" style="display:none;">🗑️ 删除站点</button><button id="saveEditBtn" class="btn-primary">保存配置</button><button id="cancelConfigBtn" class="btn-danger">取消</button></div>
                    </div>
                    <div id="panelCreate" class="panel">
                        <div class="field-row"><label for="newStncode">站点编码</label><input type="text" id="newStncode" placeholder="例如 33300011"></div>
                        <div class="field-row"><label for="newShortname">站点简称</label><input type="text" id="newShortname" placeholder="中国石化新站点"></div>
                        <div class="field-row"><label>交易组织代码</label><input type="text" id="newTransactionorgcode"></div>
                        <div class="field-group"><div class="field-row"><label>已用次数</label><input type="number" id="newUsedcount"></div><div class="field-row"><label>每日次数</label><input type="number" id="newCount"></div></div>
                        <div class="field-group"><div class="field-row"><label>开始日期</label><input type="date" id="newStartdate"></div><div class="field-row"><label>结束日期</label><input type="date" id="newEnddate"></div></div>
                        <div class="fuel-section"><label>油品映射</label><div class="fuel-editor-container" id="fuelMappingEditor"></div></div>
                        <div class="cardno-section"><label>卡号数组</label><div class="cardno-editor-container" id="newCardnoEditor"></div></div>
                        <div class="edit-create-footer"><button id="saveCreateBtn" class="btn-primary">保存配置</button><button id="cancelConfigBtn2" class="btn-danger">取消</button></div>
                    </div>
                    <div id="panelBatch" class="panel">
                        <div class="batch-section">
                            <div class="batch-controls"><button id="enableAllBtn" class="btn-success">✅ 全部启用</button><button id="disableAllBtn" class="btn-danger">⛔ 全部禁用</button><button id="enableSelectedBtn" class="btn-primary">✔️ 启用选中</button><button id="disableSelectedBtn" class="btn-primary">❌ 禁用选中</button></div>
                            <div class="date-range-panel"><div class="date-input"><label for="customStartDate">开始日期</label><input type="date" id="customStartDate"></div><div class="date-input"><label for="customEndDate">结束日期</label><input type="date" id="customEndDate"></div></div>
                            <div class="station-list" id="stationChecklist">${stationsList.map(s => { const today = new Date().toISOString().slice(0,10); const start = s.startdate ? s.startdate.slice(0,10) : ''; const end = s.enddate ? s.enddate.slice(0,10) : ''; const isEnabled = (start <= today && today <= end); return `<div class="station-item"><input type="checkbox" value="${escapeHtml(s.id)}" id="chk_${escapeHtml(s.id)}"><label for="chk_${escapeHtml(s.id)}">${escapeHtml(s.stncode)} - ${escapeHtml(s.shortname)} (区间: ${escapeHtml(start||'无')} ~ ${escapeHtml(end||'无')}) ${isEnabled ? '✅启用中' : '❌已禁用'}</label></div>`; }).join('')}</div>
                            <div class="batch-action-buttons"><button id="applyDateToSelected" class="btn-primary">📅 应用到选中</button><button id="applyDateToAll" class="btn-primary">📅 应用到全部</button><button id="cancelBatchBtn" class="btn-danger">取消</button></div>
                        </div>
                    </div>
                    <p id="configMsg" class="error"></p></div>`;
                document.body.appendChild(overlay);
                document.getElementById('batchCreateInConfigBtn').addEventListener('click', batchCreateAccounts);
                const closeModal = () => overlay.remove();
                document.getElementById('closeConfigModal').onclick = closeModal;
                document.getElementById('cancelConfigBtn').onclick = closeModal;
                document.getElementById('cancelConfigBtn2').onclick = closeModal;
                document.getElementById('cancelBatchBtn').onclick = closeModal;
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                const tabEdit = document.getElementById('tabEdit'), tabCreate = document.getElementById('tabCreate'), tabBatch = document.getElementById('tabBatch');
                const panelEdit = document.getElementById('panelEdit'), panelCreate = document.getElementById('panelCreate'), panelBatch = document.getElementById('panelBatch');
                function setActiveTab(active) {
                    [tabEdit,tabCreate,tabBatch].forEach(t => t.classList.remove('active'));
                    [panelEdit,panelCreate,panelBatch].forEach(p => p.classList.remove('active'));
                    if (active === 'edit') { tabEdit.classList.add('active'); panelEdit.classList.add('active'); }
                    else if (active === 'create') { tabCreate.classList.add('active'); panelCreate.classList.add('active'); }
                    else { tabBatch.classList.add('active'); panelBatch.classList.add('active'); }
                }
                tabEdit.onclick = () => setActiveTab('edit');
                tabCreate.onclick = () => setActiveTab('create');
                tabBatch.onclick = () => setActiveTab('batch');
                const fuelEditor = new FuelMappingEditor(document.getElementById('fuelMappingEditor'), "gcode:60518727,gname:95号车用汽油(ⅥB),gcode:60518726,gname:92号车用汽油(ⅥB),gcode:60514943,gname:0号车用柴油(VI)", true);
                const newCardnoEditor = new CardnoEditor(document.getElementById('newCardnoEditor'), "1000419000000071231,1000419000000064385,1000419000000066590,1000419000000069220", true);
                let editFuelEditor = null, editCardnoEditor = null;
                document.getElementById('lockFuelEdit').addEventListener('click', () => {
                    fuelLocked = !fuelLocked; document.getElementById('lockFuelEdit').textContent = fuelLocked ? '🔒' : '🔓';
                    if (editFuelEditor) editFuelEditor.setEnabled(!fuelLocked);
                });
                document.getElementById('lockCardnoEdit').addEventListener('click', () => {
                    cardnoLocked = !cardnoLocked; document.getElementById('lockCardnoEdit').textContent = cardnoLocked ? '🔒' : '🔓';
                    if (editCardnoEditor) editCardnoEditor.setEnabled(!cardnoLocked);
                });
                async function loadStationForEdit(stationId) {
                    if (!stationId) { document.getElementById('deleteStationBtn').style.display = 'none'; return; }
                    try {
                        const { data, error } = await supabase.from('stations').select('*').eq('id', stationId).single();
                        if (error) throw error;
                        if (data) {
                            document.getElementById('transactionorgcode').value = data.transactionorgcode || '';
                            document.getElementById('usedcount').value = data.usedcount ?? '';
                            document.getElementById('count').value = data.count ?? '';
                            document.getElementById('startdate').value = data.startdate ? data.startdate.slice(0,10) : '';
                            document.getElementById('enddate').value = data.enddate ? data.enddate.slice(0,10) : '';
                            document.getElementById('lastresetdate').value = data.lastresetdate ? data.lastresetdate.slice(0,10) : '';
                            document.getElementById('user_id').value = data.user_id || '';
                            editFuelEditor = new FuelMappingEditor(document.getElementById('editFuelMappingEditor'), data.fuelmappings || '', !fuelLocked);
                            editCardnoEditor = new CardnoEditor(document.getElementById('editCardnoEditor'), data.cardnoarray || '', !cardnoLocked);
                            document.getElementById('deleteStationBtn').style.display = 'inline-block';
                        }
                    } catch (err) { document.getElementById('configMsg').textContent = '加载站点数据失败: ' + err.message; }
                }
                document.getElementById('stationSelect').addEventListener('change', (e) => {
                    currentEditStationId = e.target.value;
                    if (currentEditStationId) loadStationForEdit(currentEditStationId);
                    else {
                        document.getElementById('deleteStationBtn').style.display = 'none';
                        ['transactionorgcode','usedcount','count','startdate','enddate','lastresetdate','user_id'].forEach(id => document.getElementById(id).value = '');
                        document.getElementById('editFuelMappingEditor').innerHTML = ''; document.getElementById('editCardnoEditor').innerHTML = '';
                    }
                });
                document.getElementById('saveEditBtn').onclick = async () => {
                    const msg = document.getElementById('configMsg'); msg.textContent = '';
                    const { data: { session } } = await supabase.auth.getSession(); if (!session) return;
                    if (!currentEditStationId) { msg.textContent = '请选择站点'; return; }
                    const config = {
                        transactionorgcode: document.getElementById('transactionorgcode').value,
                        usedcount: parseInt(document.getElementById('usedcount').value) || null,
                        count: parseInt(document.getElementById('count').value) || null,
                        startdate: document.getElementById('startdate').value || null,
                        enddate: document.getElementById('enddate').value || null,
                        lastresetdate: document.getElementById('lastresetdate').value || null,
                        user_id: document.getElementById('user_id').value,
                        fuelmappings: serializeFuelMappings(editFuelEditor.getMappings()),
                        cardnoarray: editCardnoEditor.getCards().join(',')
                    };
                    try {
                        const res = await fetch(`${SUPABASE_URL}/functions/v1/update-station-config`, { method: 'POST', headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ stationId: currentEditStationId, config }) });
                        const result = await res.json();
                        if (!res.ok) throw new Error(result.error);
                        showToast('更新成功', 'success'); closeModal();
                    } catch (err) { msg.textContent = '保存失败: ' + err.message; }
                };
                document.getElementById('saveCreateBtn').onclick = async () => {
                    const msg = document.getElementById('configMsg'); msg.textContent = '';
                    const { data: { session } } = await supabase.auth.getSession(); if (!session) return;
                    const stncode = document.getElementById('newStncode').value.trim();
                    const shortname = document.getElementById('newShortname').value.trim();
                    if (!stncode || !shortname) { msg.textContent = '站点编码和简称为必填'; return; }
                    const newStation = {
                        stncode, shortname,
                        transactionorgcode: document.getElementById('newTransactionorgcode').value,
                        usedcount: parseInt(document.getElementById('newUsedcount').value) || null,
                        count: parseInt(document.getElementById('newCount').value) || null,
                        startdate: document.getElementById('newStartdate').value || null,
                        enddate: document.getElementById('newEnddate').value || null,
                        fuelmappings: serializeFuelMappings(fuelEditor.getMappings()),
                        cardnoarray: newCardnoEditor.getCards().join(',')

                    try {
                        const res = await fetch(`${SUPABASE_URL}/functions/v1/create-station`, { method: 'POST', headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(newStation) });
                        const result = await res.json();
                        if (!res.ok) throw new Error(result.error);
                        showToast('新增成功', 'success'); closeModal();
                    } catch (err) { msg.textContent = '新增失败: ' + err.message; }
                };
                document.getElementById('deleteStationBtn').onclick = async () => {
                    if (!currentEditStationId) return;
                    if (!confirm('确定删除该站点？此操作不可撤销！')) return;
                    try {
                        const { error } = await supabase.from('stations').delete().eq('id', currentEditStationId);
                        if (error) throw error;
                        showToast('站点已删除', 'success'); closeModal();
                    } catch (err) { document.getElementById('configMsg').textContent = '删除失败: ' + err.message; }
                };
                async function updateStationsDates(stationIds, startdate, enddate) {
                    if (!stationIds.length) { showToast('没有选中任何站点'); return; }
                    const { data: { session } } = await supabase.auth.getSession(); if (!session) return;
                    try {
                        const res = await fetch(`${SUPABASE_URL}/functions/v1/update-stations-dates`, { method: 'POST', headers: { 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ stationIds, startdate, enddate }) });
                        const result = await res.json();
                        if (!res.ok) throw new Error(result.error);
                        showToast(`成功更新 ${result.updatedCount} 个站点`, 'success');
                        await refreshStationList();
                    } catch (err) { showToast('批量更新失败: ' + err.message); }
                }
                function getSelectedIds() { return Array.from(document.querySelectorAll('#stationChecklist input[type="checkbox"]:checked')).map(cb => cb.value); }
                async function refreshStationList() {
                    const { data, error } = await supabase.from('stations').select('id, stncode, shortname, startdate, enddate');
                    if (!error && data) {
                        stationsList = data; const container = document.getElementById('stationChecklist');
                        const today = new Date().toISOString().slice(0,10);
                        container.innerHTML = stationsList.map(s => {
                            const start = s.startdate ? s.startdate.slice(0,10) : ''; const end = s.enddate ? s.enddate.slice(0,10) : '';
                            const isEnabled = (start <= today && today <= end);
                            return `<div class="station-item"><input type="checkbox" value="${escapeHtml(s.id)}" id="chk_${escapeHtml(s.id)}"><label for="chk_${escapeHtml(s.id)}">${escapeHtml(s.stncode)} - ${escapeHtml(s.shortname)} (区间: ${escapeHtml(start||'无')} ~ ${escapeHtml(end||'无')}) ${isEnabled ? '✅启用中' : '❌已禁用'}</label></div>`;
                        }).join('');
                    }
                }
                const todayStr = new Date().toISOString().slice(0,10), farFuture = '2099-12-31';
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1); const yesterdayStr = yesterday.toISOString().slice(0,10);
                document.getElementById('enableAllBtn').onclick = () => {
                    if (!confirm('⚠️ 确定要启用全部站点吗？')) return;
                    updateStationsDates(stationsList.map(s => s.id), todayStr, farFuture);
                };
                document.getElementById('disableAllBtn').onclick = () => {
                    if (!confirm('⚠️ 确定要禁用全部站点吗？这可能导致服务不可用！')) return;
                    updateStationsDates(stationsList.map(s => s.id), null, yesterdayStr);
                };
                document.getElementById('enableSelectedBtn').onclick = () => {
                    const ids = getSelectedIds(); if (!ids.length) showToast('请先勾选');
                    else {
                        if (!confirm('⚠️ 确定要启用选中的站点吗？')) return;
                        updateStationsDates(ids, todayStr, farFuture);
                    }
                };
                document.getElementById('disableSelectedBtn').onclick = () => {
                    const ids = getSelectedIds(); if (!ids.length) showToast('请先勾选');
                    else {
                        if (!confirm('⚠️ 确定要禁用选中的站点吗？')) return;
                        updateStationsDates(ids, null, yesterdayStr);
                    }
                };
                document.getElementById('applyDateToSelected').onclick = () => {
                    const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value;
                    if (!start || !end) showToast('请填写完整日期');
                    else { const ids = getSelectedIds(); if (!ids.length) showToast('请先勾选站点'); else updateStationsDates(ids, start, end); }
                };
                document.getElementById('applyDateToAll').onclick = () => {
                    const start = document.getElementById('customStartDate').value, end = document.getElementById('customEndDate').value;
                    if (!start || !end) showToast('请填写完整日期');
                    else updateStationsDates(stationsList.map(s => s.id), start, end);
                };
            }

            function bindEvents() {
                document.getElementById('loginBtn').addEventListener('click', login);
                document.getElementById('logoutBtn').addEventListener('click', logout);
                document.getElementById('togglePwd').addEventListener('click', () => {
                    const pwd = document.getElementById('password'), btn = document.getElementById('togglePwd');
                    if (pwd.type === 'password') { pwd.type = 'text'; btn.innerHTML = '🙈'; }
                    else { pwd.type = 'password'; btn.innerHTML = '👁️'; }
                });
                document.getElementById('adminBtn').addEventListener('click', showAdminPanel);
                document.getElementById('configBtn').addEventListener('click', showStationConfig);
                document.getElementById('monthSelect').addEventListener('change', () => loadMonthData(document.getElementById('monthSelect').value));
                let filterTimeout;
                document.getElementById('stncodeFilter').addEventListener('input', function(e) {
                    clearTimeout(filterTimeout);
                    filterTimeout = setTimeout(() => { currentFilterStncode = e.target.value.trim(); currentPage = 1; renderTable(); updateGlobalStats(); renderSummary(document.getElementById('monthSelect').value); }, 300);
                });
                document.getElementById('applyFilterBtn').onclick = () => { currentFilterStncode = document.getElementById('stncodeFilter').value.trim(); currentPage = 1; renderTable(); updateGlobalStats(); renderSummary(document.getElementById('monthSelect').value); };
                document.getElementById('resetFilterBtn').onclick = () => { document.getElementById('stncodeFilter').value = ''; currentFilterStncode = ''; currentPage = 1; renderTable(); updateGlobalStats(); renderSummary(document.getElementById('monthSelect').value); };
                document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && document.getElementById('loginSection').style.display !== 'none') { const loginBtn = document.getElementById('loginBtn'); if (loginBtn && !loginBtn.disabled) login(); } });
            }

            buildUI(); bindEvents();
            (async function init() { const { data: { session } } = await supabase.auth.getSession(); if (session) await showData(); else showLogin(); })();
        })();
    </script>
